esphome:
  name: esphome-bluetooth-proxy
  friendly_name: ESPHome Bluetooth Proxy
  min_version: 2026.4.0
  name_add_mac_suffix: false
esp32:
  variant: ESP32
  framework:
    type: esp-idf

esp32_ble_tracker:
  id: Kitchen_BLE_Hub

sensor:
  - platform: inkbird_ibsth1_mini
    mac_address: 49:25:05:12:01:90
    temperature:
      name: "Pool Temperature"
      on_value:
        - output.turn_on: onboard_led
        - delay: 200ms
        - output.turn_off: onboard_led
    battery_level:
      name: "Inkbird IBS-TH1 Battery Level"
      on_value:
        - output.turn_on: onboard_led
        - delay: 200ms
        - output.turn_off: onboard_led

# Onboard LED (GPIO2 on ELEGOO ESP-WROOM-32) — flashes briefly each time a sensor reading is sent
output:
  - platform: gpio
    pin: GPIO2
    id: onboard_led

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

