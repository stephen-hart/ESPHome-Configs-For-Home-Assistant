# Board: ESP32-2432S028R CYD (Sunton (JCZN))
# Definition: definitions/boards/jczn_2432s028r/manifest.yaml

esphome:
  name: master-bedroom-touchscreen
  friendly_name: Master Bedroom Touchscreen
  on_boot:
    then:
      - script.execute: screen_timeout

esp32:
  variant: esp32
  flash_size: 4MB

logger:

api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Master Bedroom  Fallback Hotspot
    password: !secret ap_password
captive_portal:


spi:
  - id: spi_display
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# 1. Configure the PWM output channel for the backlight
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "CYD Display Backlight"
    id: cyd_backlight
    restore_mode: ALWAYS_ON

# Turns the backlight on and restarts a 20s countdown every time it's
# called. Since mode is "restart", each new touch cancels the pending
# delay/turn-off and starts a fresh one, so the screen only turns off
# after 20s of no touches.
script:
  - id: screen_timeout
    mode: restart
    then:
      - light.turn_on: cyd_backlight
      - delay: 20s
      - light.turn_off: cyd_backlight

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: spi_touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    display: cyd_display # Links touchscreen directly to display engine

    # Corrected modern nested calibration syntax
    calibration:
      x_min: 300
      x_max: 3800
      y_min: 200
      y_max: 3700

    # Ensures touch inputs map properly to a 90-degree landscape rotation
    transform:
      swap_xy: true

    # Any touch anywhere on the screen resets the backlight timeout
    on_touch:
      then:
        - script.execute: screen_timeout

font:
  - file: "gfonts://Roboto"
    id: grid_font
    size: 14
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: icon_font
    size: 32
    glyphs: [
        "\U000F1253", # mdi-lightbulb-group (Study Lights)
        "\U000F02E3", # mdi-bed (Bedroom)
        "\U000F095F", # mdi-desk-lamp (Steve's Desk, Emma's Desk)
        "\U000F032A", # mdi-leaf (Eco)
        "\U000F001B", # mdi-air-conditioner (Aircon)
    ]

text_sensor:
  - platform: homeassistant
    id: ha_item_6
    entity_id: climate.study_air_conditioner

# 1. Track Home Assistant states and define physical touchscreen zones
binary_sensor:
  # Home Assistant Trackers
  - platform: homeassistant
    id: ha_item_1
    entity_id: light.steve_s_desk_lights
  - platform: homeassistant
    id: ha_item_2
    entity_id: light.study_lights
    on_state:
      then:
        - logger.log:
            format: "ha_item_2 (Study Lights) received state: %s"
            args: [ 'x ? "on" : "off"' ]
  - platform: homeassistant
    id: ha_item_3
    entity_id: light.bedroom
  - platform: homeassistant
    id: ha_item_4
    entity_id: light.emma_s_desk_lights
  - platform: homeassistant
    id: ha_item_5
    entity_id: input_boolean.eco_mode

  # Touchscreen Button Zones (Replacing touch_component)
  - platform: touchscreen
    name: "Steve's Desk Touch"
    x_min: 5
    x_max: 105
    y_min: 5
    y_max: 115
    on_press:
      then:
        - homeassistant.service:
            service: homeassistant.toggle
            data: { entity_id: light.steve_s_desk_lights }

  - platform: touchscreen
    name: "Study Lights Touch"
    x_min: 110
    x_max: 210
    y_min: 5
    y_max: 115
    on_press:
      then:
        - homeassistant.service:
            service: homeassistant.toggle
            data: { entity_id: light.study_lights }

  - platform: touchscreen
    name: "Button 3 Touch"
    x_min: 215
    x_max: 315
    y_min: 5
    y_max: 115
    on_press:
      then:
        - homeassistant.service:
            service: homeassistant.toggle
            data: { entity_id: light.bedroom }

  - platform: touchscreen
    name: "Emma's Desk Touch"
    x_min: 5
    x_max: 105
    y_min: 125
    y_max: 235
    on_press:
      then:
        - homeassistant.service:
            service: homeassistant.toggle
            data: { entity_id: light.emma_s_desk_lights }

  - platform: touchscreen
    name: "Button 5 Touch"
    x_min: 110
    x_max: 210
    y_min: 125
    y_max: 235
    on_press:
      then:
        - homeassistant.service:
            service: homeassistant.toggle
            data: { entity_id: input_boolean.eco_mode }

  - platform: touchscreen
    name: "Aircon Touch"
    x_min: 215
    x_max: 315
    y_min: 125
    y_max: 235
    on_press:
      then:
        # Only fire the HA action if a real subscribed client (i.e. Home
        # Assistant, not just a logger/dashboard connection) is present
        - if:
            condition:
              api.connected:
                state_subscription_only: true
            then:
              # Toggles between Cool and Off based on the current HVAC mode
              - if:
                  condition:
                    lambda: 'return id(ha_item_6).state == "off";'
                  then:
                    - homeassistant.service:
                        service: climate.set_hvac_mode
                        data:
                          entity_id: climate.study_air_conditioner
                          hvac_mode: cool
                  else:
                    - homeassistant.service:
                        service: climate.set_hvac_mode
                        data:
                          entity_id: climate.study_air_conditioner
                          hvac_mode: "off"
            else:
              - logger.log:
                  format: "Aircon toggle skipped — Home Assistant is not connected"
                  level: WARN

# 2. Interface Layer
display:
  - platform: ili9xxx
    model: ILI9341
    id: cyd_display
    spi_id: spi_display
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO18
    rotation: 90
    color_palette: 8BIT
    invert_colors: false

    pages:
      - id: main_grid
        lambda: |-
          Color color_on = Color(46, 204, 113);
          Color color_off = Color(149, 165, 166);
          Color text_color = Color(255, 255, 255);

          // ROW 1
          it.filled_rectangle(5, 5, 100, 110, id(ha_item_1).state ? color_on : color_off);
          it.print(55, 30, id(icon_font), text_color, TextAlign::CENTER, "\U000F095F"); // mdi-desk-lamp
          it.printf(55, 60, id(grid_font), text_color, TextAlign::CENTER, "Steve's");
          it.printf(55, 78, id(grid_font), text_color, TextAlign::CENTER, "Desk");

          it.filled_rectangle(110, 5, 100, 110, id(ha_item_2).state ? color_on : color_off);
          it.print(160, 30, id(icon_font), text_color, TextAlign::CENTER, "\U000F1253"); // mdi-lightbulb-group
          it.printf(160, 68, id(grid_font), text_color, TextAlign::CENTER, "Study");

          it.filled_rectangle(215, 5, 100, 110, id(ha_item_3).state ? color_on : color_off);
          it.print(265, 30, id(icon_font), text_color, TextAlign::CENTER, "\U000F02E3"); // mdi-bed
          it.printf(265, 68, id(grid_font), text_color, TextAlign::CENTER, "Bedroom");

          // ROW 2
          it.filled_rectangle(5, 125, 100, 110, id(ha_item_4).state ? color_on : color_off);
          it.print(55, 150, id(icon_font), text_color, TextAlign::CENTER, "\U000F095F"); // mdi-desk-lamp
          it.printf(55, 180, id(grid_font), text_color, TextAlign::CENTER, "Emma's");
          it.printf(55, 198, id(grid_font), text_color, TextAlign::CENTER, "Desk");

          it.filled_rectangle(110, 125, 100, 110, id(ha_item_5).state ? color_on : color_off);
          it.print(160, 150, id(icon_font), text_color, TextAlign::CENTER, "\U000F032A"); // mdi-leaf
          it.printf(160, 188, id(grid_font), text_color, TextAlign::CENTER, "Eco");

          // Checks if the climate entity is anything other than "off"
          bool ac_on = strcmp(id(ha_item_6).state.c_str(), "off") != 0;
          it.filled_rectangle(215, 125, 100, 110, ac_on ? color_on : color_off);
          it.print(265, 150, id(icon_font), text_color, TextAlign::CENTER, "\U000F001B"); // mdi-air-conditioner
          it.printf(265, 188, id(grid_font), text_color, TextAlign::CENTER, "Aircon");